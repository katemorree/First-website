<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n>Page Not Found — Sameo Smash</title>
<meta name="description" content="That page doesn't exist. Head back to the Sameo Smash menu or get in touch.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0c0b">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Montserrat covers Cyrillic and Noto Sans Georgian covers Georgian; the
     browser only downloads the alphabets a page actually uses. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@500;600;800&family=Noto+Sans+Georgian:wght@400;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
/* Marks that JavaScript is running, and hides the page for a moment so a
   returning Russian or Georgian visitor never sees English flash past
   first. The timer clears it on its own, so if js/i18n.js ever fails to
   load the page still appears. */
(function (d) {
  var e = d.documentElement;
  e.classList.add('js', 'lang-boot');
  setTimeout(function () { e.classList.remove('lang-boot'); }, 1500);
})(document);
</script>
</head>
<body>
<a data-i18n class="skip-link" href="#main">Skip to content</a>

<header class="header">
  <div class="wrap nav">
    <a class="brand" href="index.html">SAMEO SMASH<em lang="ka">სამეო სმეშ</em></a>
    <nav class="nav__links" aria-label="Primary">
      <a data-i18n href="index.html">Home</a>
      <a data-i18n href="menu.html">Menu</a>
      <a data-i18n href="about.html">About</a>
      <a data-i18n href="contact.html">Location</a>
    <a data-i18n data-order class="nav__links-cta" href="contact.html#order">Order Now</a>
    </nav>
    <div class="nav__actions">
      <a data-i18n data-order class="btn btn--primary nav__cta" href="contact.html#order">Order Now</a>
      <button data-i18n-attr="aria-label" class="nav__toggle" type="button" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero" style="min-height:60vh;display:grid;place-items:center">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="wrap" style="text-align:center">
      <p data-i18n class="eyebrow" style="justify-content:center">Error 404</p>
      <h1 data-i18n>This Page<br>Got Smashed</h1>
      <p data-i18n class="lead" style="max-width:46ch;margin-inline:auto">
        We couldn't find that one. The menu is still exactly where you left it.
      </p>
      <div class="btn-row btn-row--center" style="margin-top:var(--sp-4)">
        <a data-i18n class="btn btn--primary" href="menu.html">View the Menu</a>
        <a data-i18n class="btn btn--ghost" href="index.html">Back to Home</a>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer__bottom" style="border-top:0">
      <p data-i18n>&copy; 2026 Sameo Smash</p>
      <p data-i18n>1 Vashlovani St, Tbilisi 0108, Georgia</p>
    </div>
  </div>
</footer>

<script src="js/i18n-data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/script.js"></script>
</body>
</html>
